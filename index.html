<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pack Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pack Tracker" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #e8e8f0; font-family: 'DM Sans', sans-serif; }
    #root { min-height: 100vh; }
    input:focus { outline: none; border-color: #6b6b8a !important; }
    input::placeholder { color: #6b6b8a; }
    select option { background: #12121a; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #1e1e2e; border-radius: 99px; }
    @keyframes slideIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin { to { transform: rotate(360deg); } }

<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const SUPABASE_URL = "https://mkmtyasbdhxgcfkrwave.supabase.co";
    const SUPABASE_KEY = "sb_publishable_XMLWaBASozx8VRO8P7aUEQ_kzh3EMw9";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const RESET_DAY = 18;

    // Default settings for new users
    const DEFAULT_SETTINGS = {
      singlesBudget: 300,
      resetDay: 18,
      apps: [
        { id:"marvel",   label:"Marvel",      icon:"M",   primary:"#e62429", secondary:"#e62429", textColor:"#fff" },
        { id:"mlb",      label:"MLB Bunt",     icon:"MLB", primary:"#002d72", secondary:"#d50032", textColor:"#fff" },
        { id:"nfl",      label:"NFL",          icon:"NFL", primary:"#013369", secondary:"#d50a0a", textColor:"#fff" },
        { id:"nba",      label:"NBA Collect",  icon:"NBA", primary:"#c9082a", secondary:"#17408b", textColor:"#fff" },
        { id:"starwars", label:"Star Wars",    icon:"SW",  primary:"#ffe81f", secondary:"#555555", textColor:"#333" },
        { id:"disney",   label:"Disney",       icon:"D",   primary:"#1a6eb5", secondary:"#00a8e0", textColor:"#fff" },
      ]
    };

    const PALETTE = [
      "#e62429","#002d72","#013369","#c9082a","#1a6eb5","#ffe81f",
      "#10b981","#8b5cf6","#f59e0b","#ec4899","#06b6d4","#84cc16",
      "#f97316","#6366f1","#14b8a6","#ef4444","#a855f7","#3b82f6",
    ];

    // ── Period logic ──────────────────────────────────────────────────────────
    function getPeriodKey(offset = 0, resetDay = RESET_DAY) {
      const now = new Date();
      let y = now.getFullYear(), m = now.getMonth();
      if (now.getDate() < resetDay) m -= 1;
      m += offset;
      while (m > 11) { m -= 12; y++; }
      while (m < 0)  { m += 12; y--; }
      return `${y}_${m}`;
    }

    function periodLabel(offset = 0, resetDay = RESET_DAY) {
      const key = getPeriodKey(offset, resetDay);
      const [y, m] = key.split("_").map(Number);
      let endM = m + 1, endY = y;
      if (endM > 11) { endM = 0; endY++; }
      const f = d => d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
      return `${f(new Date(y, m, resetDay))} – ${f(new Date(endY, endM, resetDay - 1))}`;
    }

    // ── Rollover ──────────────────────────────────────────────────────────────
    function calcPackRollover(appId, packBudget, currentOffset, allData, resetDay) {
      let rollover = 0;
      for (let i = 24; i >= 1; i--) {
        const key = getPeriodKey(currentOffset - i, resetDay);
        const period = allData[key];
        if (!period || !period[`pack_${appId}`]) continue;
        const spent = period[`pack_${appId}`].reduce((s,t) => s+t.amount, 0);
        rollover = Math.max(0, packBudget + rollover - spent);
      }
      return rollover;
    }

    function calcSinglesRollover(singlesBudget, currentOffset, allData, resetDay) {
      let rollover = 0;
      for (let i = 24; i >= 1; i--) {
        const key = getPeriodKey(currentOffset - i, resetDay);
        const period = allData[key];
        if (!period || !period.singles) continue;
        const spent = period.singles.reduce((s,t) => s+t.amount, 0);
        rollover = Math.max(0, singlesBudget + rollover - spent);
      }
      return rollover;
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    const fmtMoney = v => v >= 0 ? `$${v.toFixed(2)}` : `-$${Math.abs(v).toFixed(2)}`;
    function guiltEmoji(pct) {
      if (pct===0) return "😌"; if (pct<30) return "🙂";
      if (pct<60)  return "😐"; if (pct<85) return "😬";
      if (pct<100) return "😰"; return "😱";
    }
    const todayStr = () => new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
    function contrastText(hex) {
      const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
      return (r*299+g*587+b*114)/1000 > 128 ? "#111" : "#fff";
    }

    // ── UI primitives ─────────────────────────────────────────────────────────
    function ProgressBar({ pct, color, over }) {
      return (
        <div style={{height:5,background:"#1e1e2e",borderRadius:99,overflow:"hidden",marginBottom:12}}>
          <div style={{height:"100%",borderRadius:99,width:`${Math.min(pct,100)}%`,background:over?"#f87171":color,transition:"width 0.4s ease"}} />
        </div>
      );
    }

    function TxRow({ tx, onDelete, showApp, apps }) {
      const [hov,setHov]=useState(false);
      const appLabel = apps?.find(a=>a.id===tx.app)?.label || tx.app;
      return (
        <div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",background:"#0a0a0f",borderRadius:8,fontSize:12,animation:"slideIn 0.2s ease"}}>
          {showApp && <span style={{fontSize:10,padding:"1px 5px",borderRadius:4,background:"rgba(129,140,248,0.15)",color:"#818cf8",whiteSpace:"nowrap"}}>{appLabel}</span>}
          <span style={{color:"#6b6b8a",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{tx.note}</span>
          <span style={{color:"#f87171",fontWeight:600,whiteSpace:"nowrap"}}>-${tx.amount.toFixed(2)}</span>
          <span style={{color:"#6b6b8a",fontSize:11,whiteSpace:"nowrap"}}>{tx.date}</span>
          <button onClick={onDelete} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
            style={{background:"none",border:"none",color:hov?"#f87171":"#2a2a3e",cursor:"pointer",fontSize:14,padding:"0 2px",lineHeight:1}}>×</button>
        </div>
      );
    }

    function AppCard({ app, packData, onAddPack, onDeletePack, rollover, apps }) {
      const [amt,setAmt]=useState(""), [note,setNote]=useState(""), [hov,setHov]=useState(false);
      const packBudget = app.packBudget || 50;
      const available = packBudget + rollover;
      const spent = packData.reduce((s,t)=>s+t.amount,0);
      const remaining = available - spent;
      const pct = (spent/available)*100;
      const over = spent > available;
      const remColor = over||pct>=85?"#f87171":pct>=60?"#fbbf24":"#4ade80";
      const handleAdd = () => {
        const a=parseFloat(amt); if(!a||a<=0) return;
        onAddPack(app.id, a, note.trim()||"Pack spend"); setAmt(""); setNote("");
      };
      return (
        <div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
          style={{background:"#12121a",border:"1px solid #1e1e2e",borderRadius:16,padding:"1.25rem",position:"relative",overflow:"hidden",transition:"transform 0.2s",transform:hov?"translateY(-2px)":"translateY(0)"}}>
          <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:`linear-gradient(90deg,${app.primary},${app.secondary})`}} />
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:34,height:34,borderRadius:8,background:app.primary,color:app.textColor||"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Bebas Neue',sans-serif",fontSize:12,letterSpacing:"0.04em"}}>{app.icon}</div>
              <div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.1rem",letterSpacing:"0.08em"}}>{app.label}</div>
                {rollover>0 && <div style={{fontSize:10,color:"#4ade80",background:"rgba(74,222,128,0.1)",padding:"1px 5px",borderRadius:99,display:"inline-block"}}>+${rollover.toFixed(0)} rollover</div>}
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.35rem",lineHeight:1,color:remColor}}>{fmtMoney(remaining)}</div>
              <div style={{fontSize:10,color:"#6b6b8a",textTransform:"uppercase",letterSpacing:"0.1em"}}>of ${packBudget} budget</div>
            </div>
          </div>
          <ProgressBar pct={pct} color={`linear-gradient(90deg,${app.primary},${app.secondary})`} over={over} />
          <div style={{fontSize:10,color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>🎴 Pack ripping only</div>
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            <input value={amt} onChange={e=>setAmt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleAdd()} type="number" min="0" step="0.01" placeholder="$0.00"
              style={{flex:1,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13}} />
            <input value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleAdd()} type="text" placeholder="Note"
              style={{flex:1.5,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13}} />
            <button onClick={handleAdd} style={{background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.3)",color:"#f59e0b",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>+ Add</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:130,overflowY:"auto"}}>
            {packData.length===0
              ? <div style={{textAlign:"center",color:"#6b6b8a",fontSize:12,padding:8}}>No packs logged yet</div>
              : packData.map((t,i)=><TxRow key={i} tx={t} onDelete={()=>onDeletePack(app.id,i)} apps={apps} />)}
          </div>
        </div>
      );
    }

    // ── Settings Screen ───────────────────────────────────────────────────────
    function SettingsScreen({ settings, onSave, onClose }) {
      const [draft, setDraft] = useState(JSON.parse(JSON.stringify(settings)));
      const [newLabel, setNewLabel] = useState(""), [newIcon, setNewIcon] = useState(""), [newColor, setNewColor] = useState("#818cf8");
      const [editIdx, setEditIdx] = useState(null);

      const updateApp = (idx, field, val) => {
        const apps = [...draft.apps];
        apps[idx] = {...apps[idx], [field]:val};
        if (field==="primary") apps[idx].textColor = contrastText(val);
        setDraft({...draft, apps});
      };

      const addApp = () => {
        if (!newLabel.trim()) return;
        const id = newLabel.toLowerCase().replace(/\s+/g,"_") + "_" + Date.now();
        const app = { id, label:newLabel.trim(), icon:newIcon.trim()||newLabel.slice(0,2).toUpperCase(), primary:newColor, secondary:newColor, textColor:contrastText(newColor), packBudget:50 };
        setDraft({...draft, apps:[...draft.apps, app]});
        setNewLabel(""); setNewIcon(""); setNewColor("#818cf8");
      };

      const removeApp = idx => setDraft({...draft, apps:draft.apps.filter((_,i)=>i!==idx)});

      return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:100,overflowY:"auto",padding:"1.5rem 1rem"}}>
          <div style={{maxWidth:600,margin:"0 auto",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:16,overflow:"hidden"}}>
            <div style={{padding:"1.25rem 1.5rem",borderBottom:"1px solid #1e1e2e",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <h2 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.5rem",letterSpacing:"0.08em"}}>⚙️ Settings</h2>
              <button onClick={onClose} style={{background:"none",border:"none",color:"#6b6b8a",cursor:"pointer",fontSize:20}}>×</button>
            </div>
            <div style={{padding:"1.25rem 1.5rem"}}>

              {/* Budgets */}
              <div style={{marginBottom:"1.5rem"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"0.1em",color:"#6b6b8a",marginBottom:10}}>BUDGET SETTINGS</div>
                <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                  <div style={{flex:1,minWidth:160}}>
                    <div style={{fontSize:11,color:"#6b6b8a",marginBottom:4}}>Singles Pool ($/month)</div>
                    <input type="number" min="0" value={draft.singlesBudget}
                      onChange={e=>setDraft({...draft,singlesBudget:parseFloat(e.target.value)||0})}
                      style={{width:"100%",background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"8px 10px",fontFamily:"inherit",fontSize:14}} />
                  </div>
                  <div style={{flex:1,minWidth:160}}>
                    <div style={{fontSize:11,color:"#6b6b8a",marginBottom:4}}>Budget Reset Day (1-28)</div>
                    <input type="number" min="1" max="28" value={draft.resetDay||18}
                      onChange={e=>setDraft({...draft,resetDay:parseInt(e.target.value)||18})}
                      style={{width:"100%",background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"8px 10px",fontFamily:"inherit",fontSize:14}} />
                  </div>
                </div>
              </div>

              {/* Apps */}
              <div style={{marginBottom:"1.5rem"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"0.1em",color:"#6b6b8a",marginBottom:10}}>YOUR APPS</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {draft.apps.map((app,idx)=>(
                    <div key={app.id} style={{background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:10,padding:"10px 12px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom: editIdx===idx?10:0}}>
                        <div style={{width:28,height:28,borderRadius:6,background:app.primary,color:app.textColor,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Bebas Neue',sans-serif",fontSize:11,flexShrink:0}}>{app.icon}</div>
                        <span style={{flex:1,fontWeight:500}}>{app.label}</span>
                        <span style={{fontSize:12,color:"#6b6b8a"}}>${app.packBudget||50}/mo</span>
                        <button onClick={()=>setEditIdx(editIdx===idx?null:idx)} style={{background:"none",border:"1px solid #1e1e2e",color:"#6b6b8a",borderRadius:6,padding:"2px 8px",cursor:"pointer",fontSize:11}}>
                          {editIdx===idx?"Done":"Edit"}
                        </button>
                        <button onClick={()=>removeApp(idx)} style={{background:"none",border:"none",color:"#6b6b8a",cursor:"pointer",fontSize:16,lineHeight:1}}
                          onMouseEnter={e=>e.target.style.color="#f87171"} onMouseLeave={e=>e.target.style.color="#6b6b8a"}>×</button>
                      </div>
                      {editIdx===idx && (
                        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                          <div style={{flex:"1 1 120px"}}>
                            <div style={{fontSize:10,color:"#6b6b8a",marginBottom:3}}>Label</div>
                            <input value={app.label} onChange={e=>updateApp(idx,"label",e.target.value)}
                              style={{width:"100%",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:6,color:"#e8e8f0",padding:"5px 8px",fontFamily:"inherit",fontSize:12}} />
                          </div>
                          <div style={{flex:"0 1 70px"}}>
                            <div style={{fontSize:10,color:"#6b6b8a",marginBottom:3}}>Icon</div>
                            <input value={app.icon} onChange={e=>updateApp(idx,"icon",e.target.value)} maxLength={4}
                              style={{width:"100%",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:6,color:"#e8e8f0",padding:"5px 8px",fontFamily:"inherit",fontSize:12}} />
                          </div>
                          <div style={{flex:"0 1 80px"}}>
                            <div style={{fontSize:10,color:"#6b6b8a",marginBottom:3}}>Pack $/mo</div>
                            <input type="number" min="0" value={app.packBudget||50} onChange={e=>updateApp(idx,"packBudget",parseFloat(e.target.value)||0)}
                              style={{width:"100%",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:6,color:"#e8e8f0",padding:"5px 8px",fontFamily:"inherit",fontSize:12}} />
                          </div>
                          <div style={{flex:"0 1 80px"}}>
                            <div style={{fontSize:10,color:"#6b6b8a",marginBottom:3}}>Color</div>
                            <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:2}}>
                              {PALETTE.map(c=>(
                                <div key={c} onClick={()=>updateApp(idx,"primary",c)}
                                  style={{width:16,height:16,borderRadius:3,background:c,cursor:"pointer",border:app.primary===c?"2px solid #fff":"2px solid transparent"}} />
                              ))}
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              {/* Add new app */}
              <div style={{marginBottom:"1.5rem"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"0.1em",color:"#6b6b8a",marginBottom:10}}>ADD NEW APP</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                  <div style={{flex:"2 1 140px"}}>
                    <div style={{fontSize:11,color:"#6b6b8a",marginBottom:4}}>App Name</div>
                    <input value={newLabel} onChange={e=>setNewLabel(e.target.value)} placeholder="e.g. WWE"
                      style={{width:"100%",background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"7px 10px",fontFamily:"inherit",fontSize:13}} />
                  </div>
                  <div style={{flex:"1 1 80px"}}>
                    <div style={{fontSize:11,color:"#6b6b8a",marginBottom:4}}>Icon (2-4 chars)</div>
                    <input value={newIcon} onChange={e=>setNewIcon(e.target.value)} placeholder="WWE" maxLength={4}
                      style={{width:"100%",background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"7px 10px",fontFamily:"inherit",fontSize:13}} />
                  </div>
                  <div style={{flex:"0 0 auto"}}>
                    <div style={{fontSize:11,color:"#6b6b8a",marginBottom:4}}>Color</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:3,maxWidth:120}}>
                      {PALETTE.map(c=>(
                        <div key={c} onClick={()=>setNewColor(c)}
                          style={{width:16,height:16,borderRadius:3,background:c,cursor:"pointer",border:newColor===c?"2px solid #fff":"2px solid transparent"}} />
                      ))}
                    </div>
                  </div>
                  <button onClick={addApp} style={{background:"rgba(129,140,248,0.1)",border:"1px solid rgba(129,140,248,0.3)",color:"#818cf8",borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13,fontWeight:600,whiteSpace:"nowrap",alignSelf:"flex-end"}}>+ Add</button>
                </div>
              </div>

              {/* Save */}
              <button onClick={()=>onSave(draft)} style={{width:"100%",background:"linear-gradient(135deg,#818cf8,#c084fc)",border:"none",borderRadius:10,color:"#fff",padding:"12px",cursor:"pointer",fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.1rem",letterSpacing:"0.1em"}}>
                Save Settings
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── Auth Screen ───────────────────────────────────────────────────────────
    function AuthScreen() {
      const [loading,setLoading]=useState(false), [err,setErr]=useState("");
      const handleGoogle = async () => {
        setLoading(true); setErr("");
        const { error } = await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo:"https://bjmach.github.io/topps-tracker", queryParams:{access_type:"offline",prompt:"consent"} } });
        if (error) { setErr(error.message); setLoading(false); }
      };
      return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"2rem",
          backgroundImage:"radial-gradient(ellipse at 20% 0%,rgba(230,36,41,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(129,140,248,0.07) 0%,transparent 50%)"}}>
          <div style={{maxWidth:400,width:"100%",textAlign:"center"}}>
            <h1 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"3rem",letterSpacing:"0.05em",background:"linear-gradient(135deg,#fff 0%,#6b6b8a 100%)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text",marginBottom:8}}>Pack Tracker</h1>
            <p style={{color:"#6b6b8a",fontSize:12,letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:"2rem"}}>Track your digital collecting budget</p>
            <div style={{background:"#12121a",border:"1px solid #1e1e2e",borderRadius:16,padding:"2rem"}}>
              {err && <p style={{color:"#f87171",fontSize:12,marginBottom:12}}>{err}</p>}
              <button onClick={handleGoogle} disabled={loading}
                style={{width:"100%",background:"#fff",border:"none",borderRadius:10,color:"#1a1a1a",padding:"12px 16px",cursor:loading?"wait":"pointer",fontFamily:"'DM Sans',sans-serif",fontSize:15,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:12,opacity:loading?0.7:1}}>
                <svg width="20" height="20" viewBox="0 0 48 48">
                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                {loading?"Redirecting…":"Continue with Google"}
              </button>
              <p style={{color:"#6b6b8a",fontSize:11,marginTop:16}}>Syncs across all your devices automatically.</p>
            </div>
          </div>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────
    function App() {
      const [session,setSession]=useState(null), [authLoading,setAuthLoading]=useState(true);
      const [allData,setAllData]=useState({}), [settings,setSettings]=useState(null);
      const [dataLoading,setDataLoading]=useState(false), [saving,setSaving]=useState(false);
      const [offset,setOffset]=useState(0), [showSettings,setShowSettings]=useState(false);
      const [singlesAmt,setSinglesAmt]=useState(""), [singlesApp,setSinglesApp]=useState(""), [singlesNote,setSinglesNote]=useState("");
      const saveTimer=useRef(null);

      useEffect(()=>{
        const handleRedirect = async () => {
          const hash = window.location.hash;
          if (hash && (hash.includes("access_token")||hash.includes("error"))) {
            const { data } = await sb.auth.getSessionFromUrl({ storeSession:true });
            if (data?.session) { setSession(data.session); setAuthLoading(false); window.history.replaceState(null,"",window.location.pathname); return; }
          }
          const { data:{ session } } = await sb.auth.getSession();
          setSession(session); setAuthLoading(false);
        };
        handleRedirect();
        const { data:{ subscription } } = sb.auth.onAuthStateChange((_e,session)=>{ setSession(session); setAuthLoading(false); });
        return ()=>subscription.unsubscribe();
      },[]);

      useEffect(()=>{
        if (!session) return;
        setDataLoading(true);
        sb.from("tracker_data").select("*").eq("user_id",session.user.id).single()
          .then(({ data })=>{
            if (data?.payload) {
              const parsed = JSON.parse(data.payload);
              setAllData(parsed.data||{});
              setSettings(parsed.settings||DEFAULT_SETTINGS);
            } else {
              setSettings(DEFAULT_SETTINGS);
            }
            setDataLoading(false);
          }).catch(()=>{ setSettings(DEFAULT_SETTINGS); setDataLoading(false); });
      },[session]);

      // Set default singlesApp when settings load
      useEffect(()=>{ if(settings?.apps?.length) setSinglesApp(settings.apps[0].id); },[settings]);

      const persist = useCallback(async (newData, newSettings) => {
        if (!session) return;
        setSaving(true);
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async ()=>{
          await sb.from("tracker_data").upsert({ user_id:session.user.id, payload:JSON.stringify({ data:newData, settings:newSettings }) },{ onConflict:"user_id" });
          setSaving(false);
        }, 600);
      },[session]);

      const updatePeriod = (updater) => {
        const key = getPeriodKey(offset, settings?.resetDay||18);
        const newAll = {...allData};
        if (!newAll[key]) newAll[key]={};
        updater(newAll[key]);
        setAllData(newAll);
        persist(newAll, settings);
      };

      const handleSaveSettings = (newSettings) => {
        setSettings(newSettings);
        setShowSettings(false);
        persist(allData, newSettings);
      };

      const resetDay = settings?.resetDay||18;
      const getPeriodData = () => allData[getPeriodKey(offset,resetDay)]||{};
      const getPackData = appId => getPeriodData()[`pack_${appId}`]||[];
      const getSinglesData = () => getPeriodData().singles||[];

      const handleAddPack = (appId, amt, note) => updatePeriod(p=>{
        const k=`pack_${appId}`; if(!p[k]) p[k]=[];
        p[k].unshift({ amount:amt, note, date:todayStr() });
      });
      const handleDeletePack = (appId,i) => updatePeriod(p=>{ const k=`pack_${appId}`; if(p[k]) p[k].splice(i,1); });
      const handleAddSingle = () => {
        const a=parseFloat(singlesAmt); if(!a||a<=0) return;
        updatePeriod(p=>{ if(!p.singles) p.singles=[]; p.singles.unshift({ amount:a, app:singlesApp, note:singlesNote.trim()||"Single", date:todayStr() }); });
        setSinglesAmt(""); setSinglesNote("");
      };
      const handleDeleteSingle = i => updatePeriod(p=>{ if(p.singles) p.singles.splice(i,1); });

      if (authLoading) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><div className="spinner"/></div>;
      if (!session) return <AuthScreen />;
      if (dataLoading||!settings) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><div className="spinner"/><p style={{color:"#6b6b8a",fontSize:13}}>Loading your collection…</p></div>;

      const apps = settings.apps||[];
      const singlesBudget = settings.singlesBudget||300;
      const singlesRollover = calcSinglesRollover(singlesBudget, offset, allData, resetDay);
      const singlesAvailable = singlesBudget + singlesRollover;
      const singlesData = getSinglesData();
      const singlesSpent = singlesData.reduce((s,t)=>s+t.amount,0);
      const singlesRemaining = singlesAvailable - singlesSpent;
      const singlesPct = (singlesSpent/singlesAvailable)*100;

      let totalPacksSpent=0;
      const packRollovers={};
      apps.forEach(app=>{
        packRollovers[app.id] = calcPackRollover(app.id, app.packBudget||50, offset, allData, resetDay);
        totalPacksSpent += getPackData(app.id).reduce((s,t)=>s+t.amount,0);
      });

      const totalSpent = totalPacksSpent+singlesSpent;
      const totalBudget = apps.reduce((s,a)=>s+(a.packBudget||50),0)+singlesAvailable;
      const totalRemaining = totalBudget-totalSpent;
      const totalPct = (totalSpent/totalBudget)*100;
      const remColor = totalRemaining<0?"#f87171":totalPct>85?"#fbbf24":"#4ade80";

      return (
        <div style={{minHeight:"100vh",background:"#0a0a0f",color:"#e8e8f0",fontFamily:"'DM Sans',sans-serif",padding:"2rem 1rem",
          backgroundImage:"radial-gradient(ellipse at 20% 0%,rgba(230,36,41,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(129,140,248,0.07) 0%,transparent 50%)"}}>

          {showSettings && <SettingsScreen settings={settings} onSave={handleSaveSettings} onClose={()=>setShowSettings(false)} />}

          {/* Header */}
          <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
            <h1 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"clamp(2.5rem,8vw,4rem)",letterSpacing:"0.05em",lineHeight:1,
              background:"linear-gradient(135deg,#fff 0%,#6b6b8a 100%)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text"}}>Pack Tracker</h1>
            <p style={{color:"#6b6b8a",fontSize:11,letterSpacing:"0.15em",textTransform:"uppercase",marginTop:4}}>
              ${apps.reduce((s,a)=>s+(a.packBudget||50),0)} packs · ${singlesBudget} singles · Resets {resetDay}th
            </p>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12,marginTop:8}}>
              {saving && <span style={{color:"#6b6b8a",fontSize:11}}>Saving…</span>}
              <button onClick={()=>setShowSettings(true)} style={{background:"none",border:"1px solid #1e1e2e",color:"#818cf8",borderRadius:6,padding:"3px 10px",fontSize:11,cursor:"pointer"}}>⚙️ Settings</button>
              <button onClick={()=>sb.auth.signOut()} style={{background:"none",border:"1px solid #1e1e2e",color:"#6b6b8a",borderRadius:6,padding:"3px 10px",fontSize:11,cursor:"pointer"}}>Sign out</button>
            </div>
          </div>

          {/* Period nav */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16,marginBottom:"2rem"}}>
            <button onClick={()=>setOffset(o=>o-1)} style={{background:"#12121a",border:"1px solid #1e1e2e",color:"#e8e8f0",width:36,height:36,borderRadius:"50%",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.35rem",letterSpacing:"0.1em"}}>{periodLabel(offset,resetDay)}</div>
              {offset!==0 && <button onClick={()=>setOffset(0)} style={{background:"none",border:"none",color:"#818cf8",fontSize:11,cursor:"pointer",textDecoration:"underline",marginTop:2}}>Back to current</button>}
            </div>
            <button onClick={()=>setOffset(o=>o+1)} style={{background:"#12121a",border:"1px solid #1e1e2e",color:"#e8e8f0",width:36,height:36,borderRadius:"50%",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
          </div>

          {/* Singles Pool */}
          <div style={{maxWidth:1100,margin:"0 auto 0.75rem",fontSize:11,color:"#6b6b8a",letterSpacing:"0.15em",textTransform:"uppercase",display:"flex",alignItems:"center",gap:10}}>
            Singles Budget — Shared Pool <div style={{flex:1,height:1,background:"#1e1e2e"}} />
          </div>
          <div style={{maxWidth:1100,margin:"0 auto 1.5rem",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:16,padding:"1.25rem",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,#818cf8,#c084fc)"}} />
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:10}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:34,height:34,borderRadius:8,background:"linear-gradient(135deg,#818cf8,#c084fc)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontFamily:"'Bebas Neue',sans-serif",fontSize:12}}>1s</div>
                <div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.15rem",letterSpacing:"0.08em"}}>Singles Pool</div>
                  <div style={{fontSize:11,color:"#6b6b8a"}}>Shared across all apps · ${singlesBudget}/month</div>
                </div>
              </div>
              <div style={{display:"flex",gap:20}}>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.35rem",lineHeight:1,color:singlesPct<60?"#4ade80":singlesPct<85?"#fbbf24":"#f87171"}}>
                    {fmtMoney(singlesRemaining)}{singlesRollover>0?` ▴$${singlesRollover.toFixed(0)}`:""}
                  </div>
                  <div style={{fontSize:10,color:"#6b6b8a",textTransform:"uppercase",letterSpacing:"0.1em"}}>Remaining</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.35rem",lineHeight:1,color:"#818cf8"}}>{fmtMoney(singlesSpent)}</div>
                  <div style={{fontSize:10,color:"#6b6b8a",textTransform:"uppercase",letterSpacing:"0.1em"}}>Spent</div>
                </div>
              </div>
            </div>
            <ProgressBar pct={singlesPct} color="linear-gradient(90deg,#818cf8,#c084fc)" over={singlesSpent>singlesAvailable} />
            <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
              <input value={singlesAmt} onChange={e=>setSinglesAmt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleAddSingle()} type="number" min="0" step="0.01" placeholder="$0.00"
                style={{flex:"1 1 80px",minWidth:80,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13}} />
              <select value={singlesApp} onChange={e=>setSinglesApp(e.target.value)}
                style={{flex:"1 1 110px",minWidth:110,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13,cursor:"pointer"}}>
                {apps.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}
              </select>
              <input value={singlesNote} onChange={e=>setSinglesNote(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleAddSingle()} type="text" placeholder="Card name / note"
                style={{flex:"2 1 140px",minWidth:140,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13}} />
              <button onClick={handleAddSingle} style={{background:"rgba(129,140,248,0.1)",border:"1px solid rgba(129,140,248,0.3)",color:"#818cf8",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>+ Add Single</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:150,overflowY:"auto"}}>
              {singlesData.length===0
                ? <div style={{textAlign:"center",color:"#6b6b8a",fontSize:12,padding:8}}>No singles logged yet</div>
                : singlesData.map((t,i)=><TxRow key={i} tx={t} onDelete={()=>handleDeleteSingle(i)} showApp apps={apps} />)}
            </div>
          </div>

          {/* Pack Cards */}
          <div style={{maxWidth:1100,margin:"0 auto 0.75rem",fontSize:11,color:"#6b6b8a",letterSpacing:"0.15em",textTransform:"uppercase",display:"flex",alignItems:"center",gap:10}}>
            Pack Ripping — Per App Budget <div style={{flex:1,height:1,background:"#1e1e2e"}} />
          </div>
          <div style={{maxWidth:1100,margin:"0 auto 2rem",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(290px,1fr))",gap:"1.25rem"}}>
            {apps.map(app=><AppCard key={app.id} app={app} packData={getPackData(app.id)} onAddPack={handleAddPack} onDeletePack={handleDeletePack} rollover={packRollovers[app.id]} apps={apps} />)}
          </div>

          {/* Summary */}
          <div style={{maxWidth:1100,margin:"0 auto",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:16,padding:"1.25rem 1.5rem",display:"flex",alignItems:"center",justifyContent:"space-around",flexWrap:"wrap",gap:16}}>
            {[{val:fmtMoney(totalPacksSpent),lbl:"Packs Spent"},{val:fmtMoney(singlesSpent),lbl:"Singles Spent"},{val:fmtMoney(totalSpent),lbl:"Total Spent"},{val:fmtMoney(totalRemaining),lbl:"Total Remaining",color:remColor}].map(({val,lbl,color})=>(
              <div key={lbl} style={{textAlign:"center"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.8rem",lineHeight:1,color:color||"#e8e8f0"}}>{val}</div>
                <div style={{fontSize:10,color:"#6b6b8a",textTransform:"uppercase",letterSpacing:"0.12em",marginTop:2}}>{lbl}</div>
              </div>
            ))}
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:"1.8rem",lineHeight:1}}>{guiltEmoji(totalPct)}</div>
              <div style={{fontSize:10,color:"#6b6b8a",textTransform:"uppercase",letterSpacing:"0.12em",marginTop:2}}>Guilt Meter</div>
            </div>
          </div>
          <p style={{textAlign:"center",color:"#2a2a3e",fontSize:10,marginTop:"1.5rem"}}>Signed in as {session.user.email}</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
