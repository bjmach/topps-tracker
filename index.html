    // ── Period logic ──────────────────────────────────────────────────────────
    function getPeriodKey(offset = 0, resetDay = RESET_DAY) {
      const now = new Date();
      let y = now.getFullYear(), m = now.getMonth();
      if (now.getDate() < resetDay) m -= 1;
      m += offset;
      while (m > 11) { m -= 12; y++; }
      while (m < 0)  { m += 12; y--; }
      return `${y}_${m}`;
    }

    function periodLabel(offset = 0, resetDay = RESET_DAY) {
      const key = getPeriodKey(offset, resetDay);
      const [y, m] = key.split("_").map(Number);
      let endM = m + 1, endY = y;
      if (endM > 11) { endM = 0; endY++; }
      const f = d => d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
      return `${f(new Date(y, m, resetDay))} – ${f(new Date(endY, endM, resetDay - 1))}`;
    }

    // ── Rollover ──────────────────────────────────────────────────────────────
    function calcPackRollover(appId, packBudget, currentOffset, allData, resetDay) {
      let rollover = 0;
      for (let i = 24; i >= 1; i--) {
        const key = getPeriodKey(currentOffset - i, resetDay);
        const period = allData[key];
        if (!period || !period[`pack_${appId}`]) continue;
        const spent = period[`pack_${appId}`].reduce((s,t) => s+t.amount, 0);
        rollover = Math.max(0, packBudget + rollover - spent);
      }
      return rollover;
    }

    function calcSinglesRollover(singlesBudget, currentOffset, allData, resetDay) {
      let rollover = 0;
      for (let i = 24; i >= 1; i--) {
        const key = getPeriodKey(currentOffset - i, resetDay);
        const period = allData[key];
        if (!period || !period.singles) continue;
        const spent = period.singles.reduce((s,t) => s+t.amount, 0);
        rollover = Math.max(0, singlesBudget + rollover - spent);
      }
      return rollover;
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    const fmtMoney = v => v >= 0 ? `$${v.toFixed(2)}` : `-$${Math.abs(v).toFixed(2)}`;
    function guiltEmoji(pct) {
      if (pct===0) return "😌"; if (pct<30) return "🙂";
      if (pct<60)  return "😐"; if (pct<85) return "😬";
      if (pct<100) return "😰"; return "😱";
    }
    const todayStr = () => new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
    function contrastText(hex) {
      const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
      return (r*299+g*587+b*114)/1000 > 128 ? "#111" : "#fff";
    }

    // ── UI primitives ─────────────────────────────────────────────────────────
    function ProgressBar({ pct, color, over }) {

    }

    function TxRow({ tx, onDelete, showApp, apps }) {

    function AppCard({ app, packData, salesData, singlesForApp, onAddPack, onDeletePack, onAddSale, onDeleteSale, rollover, apps, locations }) {
      const [tab, setTab] = useState("packs"); // packs | sales
      const [amt,setAmt]=useState(""), [note,setNote]=useState(""), [hov,setHov]=useState(false);
      const [saleAmt,setSaleAmt]=useState(""), [saleNote,setSaleNote]=useState(""), [saleLoc,setSaleLoc]=useState("");
      const [saleImage,setSaleImage]=useState(null), [saleImagePreview,setSaleImagePreview]=useState(null), [uploading,setUploading]=useState(false);
      const fileInputRef = useRef(null);
      const packBudget = app.packBudget || 50;
      const available = packBudget + rollover;
      const packSpent = packData.reduce((s,t)=>s+t.amount,0);
      const singlesSpent = singlesForApp.reduce((s,t)=>s+t.amount,0);
      const totalSpent = packSpent + singlesSpent;
      const totalSold = salesData.reduce((s,t)=>s+t.amount,0);
      const pnl = totalSold - totalSpent;
      const remaining = available - packSpent;
      const pct = (packSpent/available)*100;
      const over = packSpent > available;
      const remColor = over||pct>=85?"#f87171":pct>=60?"#fbbf24":"#4ade80";
      const pnlColor = pnl > 0 ? "#4ade80" : pnl < 0 ? "#f87171" : "#6b6b8a";

      const handleImageChange = (e) => {

      const handleAddPack = () => {
        const a=parseFloat(amt); if(!a||a<=0) return;
        onAddPack(app.id, a, note.trim()||"Pack spend"); setAmt(""); setNote("");
      };
      const handleAddSale = async () => {
        const a=parseFloat(saleAmt); if(!a||a<=0) return;
        setUploading(true);
        let imageUrl = null;
        if (saleImage) {
          const ext = saleImage.name.split(".").pop();

          if (!error) {
            const { data } = sb.storage.from("card-images").getPublicUrl(path);

          }

        onAddSale(app.id, a, saleNote.trim()||"Sale", saleLoc||undefined, imageUrl);

              <div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.1rem",letterSpacing:"0.08em"}}>{app.label}</div>
                {rollover>0 && <div style={{fontSize:10,color:"#4ade80",background:"rgba(74,222,128,0.1)",padding:"1px 5px",borderRadius:99,display:"inline-block"}}>+${rollover.toFixed(0)} rollover</div>}

              <input value={saleNote} onChange={e=>setSaleNote(e.target.value)} type="text" placeholder="Card sold"
                style={{flex:"2 1 110px",minWidth:110,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13}} />
            </div>
            <div style={{display:"flex",gap:6,marginBottom:8,alignItems:"center"}}>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageChange} style={{display:"none"}} />
              <button onClick={()=>fileInputRef.current?.click()}

      return (

                    <input type="number" min="0" value={draft.singlesBudget}
                      onChange={e=>setDraft({...draft,singlesBudget:parseFloat(e.target.value)||0})}
                      style={{width:"100%",background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"8px 10px",fontFamily:"inherit",fontSize:14}} />
                  </div>
                  <div style={{flex:1,minWidth:160}}>
                    <div style={{fontSize:11,color:"#6b6b8a",marginBottom:4}}>Budget Reset Day (1-28)</div>
                    <input type="number" min="1" max="28" value={draft.resetDay||18}
                      onChange={e=>setDraft({...draft,resetDay:parseInt(e.target.value)||18})}
                      style={{width:"100%",background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"8px 10px",fontFamily:"inherit",fontSize:14}} />
                  </div>
                </div>
              </div>

              {/* Apps */}
              <div style={{marginBottom:"1.5rem"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"0.1em",color:"#6b6b8a",marginBottom:10}}>YOUR APPS</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {draft.apps.map((app,idx)=>(
                    <div key={app.id} style={{background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:10,padding:"10px 12px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom: editIdx===idx?10:0}}>
                        <div style={{width:28,height:28,borderRadius:6,background:app.primary,color:app.textColor,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Bebas Neue',sans-serif",fontSize:11,flexShrink:0}}>{app.icon}</div>
                        <span style={{flex:1,fontWeight:500}}>{app.label}</span>
                        <span style={{fontSize:12,color:"#6b6b8a"}}>${app.packBudget||50}/mo</span>
                        <button onClick={()=>setEditIdx(editIdx===idx?null:idx)} style={{background:"none",border:"1px solid #1e1e2e",color:"#6b6b8a",borderRadius:6,padding:"2px 8px",cursor:"pointer",fontSize:11}}>
                          {editIdx===idx?"Done":"Edit"}
                        </button>
                        <button onClick={()=>removeApp(idx)} style={{background:"none",border:"none",color:"#6b6b8a",cursor:"pointer",fontSize:16,lineHeight:1}}
                          onMouseEnter={e=>e.target.style.color="#f87171"} onMouseLeave={e=>e.target.style.color="#6b6b8a"}>×</button>
                      </div>
                      {editIdx===idx && (
                        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                          <div style={{flex:"1 1 120px"}}>
                            <div style={{fontSize:10,color:"#6b6b8a",marginBottom:3}}>Label</div>
                            <input value={app.label} onChange={e=>updateApp(idx,"label",e.target.value)}
                              style={{width:"100%",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:6,color:"#e8e8f0",padding:"5px 8px",fontFamily:"inherit",fontSize:12}} />
                          </div>
                          <div style={{flex:"0 1 70px"}}>
                            <div style={{fontSize:10,color:"#6b6b8a",marginBottom:3}}>Icon</div>
                            <input value={app.icon} onChange={e=>updateApp(idx,"icon",e.target.value)} maxLength={4}
                              style={{width:"100%",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:6,color:"#e8e8f0",padding:"5px 8px",fontFamily:"inherit",fontSize:12}} />
                          </div>
                          <div style={{flex:"0 1 80px"}}>
                            <div style={{fontSize:10,color:"#6b6b8a",marginBottom:3}}>Pack $/mo</div>
                            <input type="number" min="0" value={app.packBudget||50} onChange={e=>updateApp(idx,"packBudget",parseFloat(e.target.value)||0)}
                              style={{width:"100%",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:6,color:"#e8e8f0",padding:"5px 8px",fontFamily:"inherit",fontSize:12}} />
                          </div>
                          <div style={{flex:"0 1 80px"}}>
                            <div style={{fontSize:10,color:"#6b6b8a",marginBottom:3}}>Color</div>
                            <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:2}}>
                              {PALETTE.map(c=>(
                                <div key={c} onClick={()=>updateApp(idx,"primary",c)}
                                  style={{width:16,height:16,borderRadius:3,background:c,cursor:"pointer",border:app.primary===c?"2px solid #fff":"2px solid transparent"}} />
                              ))}
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              {/* Add new app */}
              <div style={{marginBottom:"1.5rem"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"0.1em",color:"#6b6b8a",marginBottom:10}}>ADD NEW APP</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                  <div style={{flex:"2 1 140px"}}>
                    <div style={{fontSize:11,color:"#6b6b8a",marginBottom:4}}>App Name</div>
                    <input value={newLabel} onChange={e=>setNewLabel(e.target.value)} placeholder="e.g. WWE"
                      style={{width:"100%",background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"7px 10px",fontFamily:"inherit",fontSize:13}} />
                  </div>
                  <div style={{flex:"1 1 80px"}}>
                    <div style={{fontSize:11,color:"#6b6b8a",marginBottom:4}}>Icon (2-4 chars)</div>
                    <input value={newIcon} onChange={e=>setNewIcon(e.target.value)} placeholder="WWE" maxLength={4}
                      style={{width:"100%",background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"7px 10px",fontFamily:"inherit",fontSize:13}} />
                  </div>
                  <div style={{flex:"0 0 auto"}}>
                    <div style={{fontSize:11,color:"#6b6b8a",marginBottom:4}}>Color</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:3,maxWidth:120}}>
                      {PALETTE.map(c=>(
                        <div key={c} onClick={()=>setNewColor(c)}
                          style={{width:16,height:16,borderRadius:3,background:c,cursor:"pointer",border:newColor===c?"2px solid #fff":"2px solid transparent"}} />
                      ))}
                    </div>
                  </div>
                  <button onClick={addApp} style={{background:"rgba(129,140,248,0.1)",border:"1px solid rgba(129,140,248,0.3)",color:"#818cf8",borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13,fontWeight:600,whiteSpace:"nowrap",alignSelf:"flex-end"}}>+ Add</button>
                </div>
              </div>

              {/* Purchase Locations */}
              <div style={{marginBottom:"1.5rem"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"0.1em",color:"#6b6b8a",marginBottom:10}}>PURCHASE LOCATIONS</div>
                <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
                  {(draft.locations||[]).map((loc,idx)=>(
                    <div key={idx} style={{display:"flex",alignItems:"center",gap:8,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,padding:"7px 10px"}}>
                      <span style={{flex:1,fontSize:13}}>{loc}</span>
                      <button onClick={()=>setDraft({...draft,locations:draft.locations.filter((_,i)=>i!==idx)})}
                        style={{background:"none",border:"none",color:"#6b6b8a",cursor:"pointer",fontSize:16,lineHeight:1}}
                        onMouseEnter={e=>e.target.style.color="#f87171"} onMouseLeave={e=>e.target.style.color="#6b6b8a"}>×</button>
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",gap:8}}>
                  <input id="newLocInput" type="text" placeholder="e.g. COMC, Mercari…"
                    style={{flex:1,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"7px 10px",fontFamily:"inherit",fontSize:13}}
                    onKeyDown={e=>{ if(e.key==="Enter"&&e.target.value.trim()){ setDraft({...draft,locations:[...(draft.locations||[]),e.target.value.trim()]}); e.target.value=""; }}} />
                  <button onClick={()=>{ const el=document.getElementById("newLocInput"); if(el.value.trim()){ setDraft({...draft,locations:[...(draft.locations||[]),el.value.trim()]}); el.value=""; }}}
                    style={{background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.3)",color:"#f59e0b",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>+ Add</button>
                </div>
              </div>

              {/* Display Name */}
              <div style={{marginBottom:"1.5rem"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"0.1em",color:"#6b6b8a",marginBottom:4}}>DISPLAY NAME</div>
                <div style={{fontSize:11,color:"#6b6b8a",marginBottom:10}}>Shown in the community Sales Feed and Wishlist instead of your email</div>
                <input
                  value={draft.displayName||""}
                  onChange={e=>setDraft({...draft,displayName:e.target.value})}
                  placeholder="e.g. CardKing87"
                  style={{width:"100%",background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"8px 10px",fontFamily:"inherit",fontSize:14}}
                />
              </div>

              {/* In-Game Usernames */}
              <div style={{marginBottom:"1.5rem"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"0.1em",color:"#6b6b8a",marginBottom:4}}>IN-GAME USERNAMES</div>
                <div style={{fontSize:11,color:"#6b6b8a",marginBottom:10}}>Used to identify you in the community wishlist</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {draft.apps.map(app=>(
                    <div key={app.id} style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:28,height:28,borderRadius:6,background:app.primary,color:app.textColor,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Bebas Neue',sans-serif",fontSize:11,flexShrink:0}}>{app.icon}</div>
                      <span style={{fontSize:13,width:90,flexShrink:0}}>{app.label}</span>
                      <input
                        value={(draft.usernames||{})[app.id]||""}
                        onChange={e=>setDraft({...draft,usernames:{...(draft.usernames||{}),[app.id]:e.target.value}})}
                        placeholder={`${app.label} username`}
                        style={{flex:1,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13}}
                      />
                    </div>
                  ))}
                </div>
              </div>

              {/* Save */}
              <button onClick={()=>onSave(draft)} style={{width:"100%",background:"linear-gradient(135deg,#818cf8,#c084fc)",border:"none",borderRadius:10,color:"#fff",padding:"12px",cursor:"pointer",fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.1rem",letterSpacing:"0.1em"}}>
                Save Settings
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── Auth Screen ───────────────────────────────────────────────────────────
    function AuthScreen() {
      const [loading,setLoading]=useState(false), [err,setErr]=useState("");
      const handleGoogle = async () => {
        setLoading(true); setErr("");
        const { error } = await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo:"https://hobby-tracker-app.netlify.app", queryParams:{access_type:"offline",prompt:"consent"} } });
        if (error) { setErr(error.message); setLoading(false); }
      };
      return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"2rem",
          backgroundImage:"radial-gradient(ellipse at 20% 0%,rgba(230,36,41,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(129,140,248,0.07) 0%,transparent 50%)"}}>
          <div style={{maxWidth:400,width:"100%",textAlign:"center"}}>
            <h1 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"3rem",letterSpacing:"0.05em",background:"linear-gradient(135deg,#fff 0%,#6b6b8a 100%)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text",marginBottom:8}}>Hobby Tracker</h1>
            <p style={{color:"#6b6b8a",fontSize:12,letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:"2rem"}}>Track your digital collecting budget</p>
            <div style={{background:"#12121a",border:"1px solid #1e1e2e",borderRadius:16,padding:"2rem"}}>
              {err && <p style={{color:"#f87171",fontSize:12,marginBottom:12}}>{err}</p>}
              <button onClick={handleGoogle} disabled={loading}
                style={{width:"100%",background:"#fff",border:"none",borderRadius:10,color:"#1a1a1a",padding:"12px 16px",cursor:loading?"wait":"pointer",fontFamily:"'DM Sans',sans-serif",fontSize:15,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:12,opacity:loading?0.7:1}}>
                <svg width="20" height="20" viewBox="0 0 48 48">
                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                {loading?"Redirecting…":"Continue with Google"}
              </button>
              <p style={{color:"#6b6b8a",fontSize:11,marginTop:16}}>Syncs across all your devices automatically.</p>
            </div>
          </div>
        </div>
      );
    }

    // ── Wishlist Feed ─────────────────────────────────────────────────────────
    function WishlistFeed({ session, settings }) {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filter, setFilter] = useState("all");
      const [addApp, setAddApp] = useState(settings?.apps?.[0]?.id||"");
      const [addCard, setAddCard] = useState("");
      const [addPrice, setAddPrice] = useState("");
      const [addNote, setAddNote] = useState("");
      const [posting, setPosting] = useState(false);

      const apps = settings?.apps||[];

      const fetchItems = () => {
        setLoading(true);
        sb.from("wishlist")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(200)
          .then(({ data }) => { setItems(data||[]); setLoading(false); });
      };

      useEffect(()=>{ fetchItems(); },[]);
      useEffect(()=>{ if(apps.length) setAddApp(apps[0].id); },[settings]);

      const handlePost = async () => {
        if (!addCard.trim()) return;
        setPosting(true);
        const appLabel = apps.find(a=>a.id===addApp)?.label||addApp;
        const ingameUsername = (settings?.usernames||{})[addApp] || settings?.displayName || session?.user?.email?.split("@")[0] || "collector";
        await sb.from("wishlist").insert({
          user_id: session.user.id,
          ingame_username: ingameUsername,
          app_id: addApp,
          app_label: appLabel,
          card_name: addCard.trim(),
          max_price: addPrice ? parseFloat(addPrice) : null,
          note: addNote.trim()||null,
          created_at: new Date().toISOString()
        });
        setAddCard(""); setAddPrice(""); setAddNote("");
        setPosting(false);
        fetchItems();
      };

      const handleDelete = async (id) => {
        await sb.from("wishlist").delete().eq("id", id);
        setItems(items.filter(i=>i.id!==id));
      };

      const filtered = filter==="all" ? items : items.filter(i=>i.app_id===filter);

      return (
        <div style={{maxWidth:800,margin:"0 auto"}}>

          {/* Post a want */}
          <div style={{background:"#12121a",border:"1px solid #1e1e2e",borderRadius:16,padding:"1.25rem",marginBottom:"1.5rem",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,#f59e0b,#ec4899)"}} />
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.1rem",letterSpacing:"0.08em",marginBottom:12}}>🔍 Post a Want</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
              <select value={addApp} onChange={e=>setAddApp(e.target.value)}
                style={{flex:"1 1 110px",minWidth:110,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"7px 10px",fontFamily:"inherit",fontSize:13,cursor:"pointer"}}>
                {apps.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}
              </select>
              <input value={addCard} onChange={e=>setAddCard(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handlePost()} placeholder="Card name (e.g. Spider-Man 1/1 Black)"
                style={{flex:"3 1 200px",minWidth:180,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"7px 10px",fontFamily:"inherit",fontSize:13}} />
              <input value={addPrice} onChange={e=>setAddPrice(e.target.value)} type="number" min="0" step="0.01" placeholder="Max $ (optional)"
                style={{flex:"1 1 110px",minWidth:110,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"7px 10px",fontFamily:"inherit",fontSize:13}} />
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
              <input value={addNote} onChange={e=>setAddNote(e.target.value)} placeholder="Notes (optional — e.g. variant, condition)"
                style={{flex:1,minWidth:180,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"7px 10px",fontFamily:"inherit",fontSize:13}} />
              <div style={{fontSize:11,color:"#6b6b8a",whiteSpace:"nowrap"}}>
                Posting as: <span style={{color:"#f59e0b"}}>{(settings?.usernames||{})[addApp] || settings?.displayName || session?.user?.email?.split("@")[0] || "collector"}</span>
              </div>
              <button onClick={handlePost} disabled={posting||!addCard.trim()}
                style={{background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.3)",color:"#f59e0b",borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap",opacity:posting?0.6:1}}>
                {posting?"Posting…":"+ Post Want"}
              </button>
            </div>
          </div>

          {/* Feed header */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1rem",flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.4rem",letterSpacing:"0.08em"}}>🔍 Community Wishlist</div>
              <div style={{fontSize:11,color:"#6b6b8a"}}>{filtered.length} wants across all collectors</div>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {session?.user?.id===ADMIN_ID && (
                <button onClick={async()=>{ if(!window.confirm("Clear ALL wishlist items? This cannot be undone.")) return; await sb.from("wishlist").delete().neq("id","00000000-0000-0000-0000-000000000000"); setItems([]); }}
                  style={{background:"rgba(248,113,113,0.1)",border:"1px solid rgba(248,113,113,0.3)",color:"#f87171",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:11,fontWeight:600}}>
                  🗑 Clear All
                </button>
              )}
              <select value={filter} onChange={e=>setFilter(e.target.value)}
                style={{background:"#12121a",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:12,cursor:"pointer"}}>
                <option value="all">All Apps</option>
                {apps.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}
              </select>
            </div>
          </div>

          {/* Items */}
          {loading ? (
            <div style={{display:"flex",justifyContent:"center",padding:"3rem"}}><div className="spinner"/></div>
          ) : filtered.length===0 ? (
            <div style={{textAlign:"center",color:"#6b6b8a",padding:"3rem",background:"#12121a",borderRadius:16,border:"1px solid #1e1e2e"}}>
              No wants posted yet. Be the first! 🔍
            </div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {filtered.map(item=>{
                const isMe = item.user_id===session?.user?.id;
                const appDef = apps.find(a=>a.id===item.app_id);
                const timeAgo = (()=>{ const d=new Date(item.created_at); const now=new Date(); const diff=Math.floor((now-d)/60000); if(diff<1) return "just now"; if(diff<60) return `${diff}m ago`; if(diff<1440) return `${Math.floor(diff/60)}h ago`; return `${Math.floor(diff/1440)}d ago`; })();
                return (
                  <div key={item.id} style={{background:"#12121a",border:`1px solid ${isMe?"rgba(245,158,11,0.3)":"#1e1e2e"}`,borderRadius:12,padding:"12px 14px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",animation:"slideIn 0.2s ease"}}>
                    <div style={{width:36,height:36,borderRadius:8,background:appDef?.primary||"#333",color:appDef?.textColor||"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Bebas Neue',sans-serif",fontSize:11,flexShrink:0}}>
                      {appDef?.icon||item.app_id?.slice(0,2).toUpperCase()}
                    </div>
                    <div style={{flex:1,minWidth:140}}>
                      <div style={{fontSize:13,fontWeight:600}}>{item.card_name}</div>
                      <div style={{fontSize:11,color:"#6b6b8a",display:"flex",gap:8,flexWrap:"wrap",marginTop:2}}>
                        <span style={{color: appDef?.primary||"#818cf8"}}>{item.app_label}</span>
                        <span>👤 <span style={{color:"#f59e0b"}}>{item.ingame_username}</span></span>
                        {item.note && <span>📝 {item.note}</span>}
                      </div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      {item.max_price && (
                        <div style={{textAlign:"right"}}>
                          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.1rem",color:"#4ade80"}}>Up to ${item.max_price.toFixed(2)}</div>
                          <div style={{fontSize:10,color:"#6b6b8a"}}>max price</div>
                        </div>
                      )}
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:10,color:"#6b6b8a"}}>{timeAgo}</div>
                        {(isMe || session?.user?.id===ADMIN_ID) && (
                          <button onClick={()=>handleDelete(item.id)} style={{background:"none",border:"none",color:"#6b6b8a",cursor:"pointer",fontSize:11,marginTop:2,textDecoration:"underline"}}
                            onMouseEnter={e=>e.target.style.color="#f87171"} onMouseLeave={e=>e.target.style.color="#6b6b8a"}>remove</button>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ── Community Feed ────────────────────────────────────────────────────────
    function CommunityFeed({ session }) {
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filter, setFilter] = useState("all");
      const [expandedImage, setExpandedImage] = useState(null);

      useEffect(()=>{
        setLoading(true);
        sb.from("community_sales")
          .select("*")
          .order("sold_at", { ascending: false })
          .limit(100)
          .then(({ data }) => { setSales(data||[]); setLoading(false); });
      },[]);

      const apps = [...new Set(sales.map(s=>s.app_label))].filter(Boolean);
      const filtered = filter==="all" ? sales : sales.filter(s=>s.app_label===filter);
      const totalVol = filtered.reduce((s,t)=>s+t.amount,0);

      return (
        <div style={{maxWidth:800,margin:"0 auto"}}>

          {/* Expanded image modal */}
          {expandedImage && (
            <div onClick={()=>setExpandedImage(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem",cursor:"pointer"}}>
              <img src={expandedImage} style={{maxWidth:"100%",maxHeight:"90vh",borderRadius:12,objectFit:"contain"}} />
              <button onClick={()=>setExpandedImage(null)} style={{position:"absolute",top:16,right:16,background:"rgba(255,255,255,0.1)",border:"none",color:"#fff",borderRadius:"50%",width:36,height:36,cursor:"pointer",fontSize:18}}>×</button>
            </div>
          )}

          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1rem",flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.4rem",letterSpacing:"0.08em"}}>🌐 Community Sales Feed</div>
              <div style={{fontSize:11,color:"#6b6b8a"}}>Sales logged by all collectors · {filtered.length} sales · ${totalVol.toFixed(2)} volume</div>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {session?.user?.id===ADMIN_ID && (
                <button onClick={async()=>{ if(!window.confirm("Clear ALL sales? This cannot be undone.")) return; await sb.from("community_sales").delete().neq("id","00000000-0000-0000-0000-000000000000"); setSales([]); }}
                  style={{background:"rgba(248,113,113,0.1)",border:"1px solid rgba(248,113,113,0.3)",color:"#f87171",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:11,fontWeight:600}}>
                  🗑 Clear All
                </button>
              )}
              <select value={filter} onChange={e=>setFilter(e.target.value)}
                style={{background:"#12121a",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:12,cursor:"pointer"}}>
                <option value="all">All Apps</option>
                {apps.map(a=><option key={a} value={a}>{a}</option>)}
              </select>
            </div>
          </div>

          {loading ? (
            <div style={{display:"flex",justifyContent:"center",padding:"3rem"}}><div className="spinner"/></div>
          ) : filtered.length===0 ? (
            <div style={{textAlign:"center",color:"#6b6b8a",padding:"3rem",background:"#12121a",borderRadius:16,border:"1px solid #1e1e2e"}}>
              No sales logged yet. Be the first! 🎴
            </div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {filtered.map((sale,i)=>{
                const isMe = sale.user_id === session?.user?.id;
                const timeAgo = (()=>{ const d=new Date(sale.sold_at); const now=new Date(); const diff=Math.floor((now-d)/60000); if(diff<1) return "just now"; if(diff<60) return `${diff}m ago`; if(diff<1440) return `${Math.floor(diff/60)}h ago`; return `${Math.floor(diff/1440)}d ago`; })();
                return (
                  <div key={i} style={{background:"#12121a",border:`1px solid ${isMe?"rgba(129,140,248,0.3)":"#1e1e2e"}`,borderRadius:12,padding:"12px 14px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",animation:"slideIn 0.2s ease"}}>
                    {/* Card image thumbnail */}
                    {sale.image_url ? (
                      <img src={sale.image_url} onClick={()=>setExpandedImage(sale.image_url)}
                        style={{width:48,height:48,borderRadius:8,objectFit:"cover",cursor:"pointer",border:"1px solid #1e1e2e",flexShrink:0,transition:"transform 0.15s"}}
                        onMouseEnter={e=>e.target.style.transform="scale(1.05)"} onMouseLeave={e=>e.target.style.transform="scale(1)"} />
                    ) : (
                      <div style={{width:48,height:48,borderRadius:8,background:"#0a0a0f",border:"1px solid #1e1e2e",display:"flex",alignItems:"center",justifyContent:"center",color:"#2a2a3e",fontSize:18,flexShrink:0}}>🃏</div>
                    )}
                    <div style={{flex:1,minWidth:120}}>
                      <div style={{fontSize:13,fontWeight:500}}>{sale.note}</div>
                      <div style={{fontSize:11,color:"#6b6b8a",display:"flex",gap:8,flexWrap:"wrap",marginTop:2}}>
                        <span style={{color:"#818cf8"}}>{sale.app_label}</span>
                        {sale.location && <span>📍 {sale.location}</span>}
                        <span>👤 {isMe?"You":sale.username}</span>
                      </div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.2rem",color:"#4ade80"}}>+${sale.amount.toFixed(2)}</div>
                      <div style={{fontSize:10,color:"#6b6b8a"}}>{timeAgo}</div>
                      {session?.user?.id===ADMIN_ID && (
                        <button onClick={async()=>{ await sb.from("community_sales").delete().eq("id",sale.id); setSales(sales.filter(s=>s.id!==sale.id)); }}
                          style={{background:"none",border:"none",color:"#6b6b8a",cursor:"pointer",fontSize:11,textDecoration:"underline",marginTop:2}}
                          onMouseEnter={e=>e.target.style.color="#f87171"} onMouseLeave={e=>e.target.style.color="#6b6b8a"}>remove</button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────
    function App() {
      const [session,setSession]=useState(null), [authLoading,setAuthLoading]=useState(true);
      const [allData,setAllData]=useState({}), [settings,setSettings]=useState(null);
      const [dataLoading,setDataLoading]=useState(false), [saving,setSaving]=useState(false);
      const [offset,setOffset]=useState(0), [showSettings,setShowSettings]=useState(false);
      const [page,setPage]=useState("tracker"); // "tracker" | "feed"
      const [singlesAmt,setSinglesAmt]=useState(""), [singlesApp,setSinglesApp]=useState(""), [singlesNote,setSinglesNote]=useState(""), [singlesLocation,setSinglesLocation]=useState("");
      const [singlesBudgetEdit,setSinglesBudgetEdit]=useState(300);
      const saveTimer=useRef(null);

      useEffect(()=>{
        const handleRedirect = async () => {
          const hash = window.location.hash;
          if (hash && (hash.includes("access_token")||hash.includes("error"))) {
            const { data } = await sb.auth.getSessionFromUrl({ storeSession:true });
            if (data?.session) { setSession(data.session); setAuthLoading(false); window.history.replaceState(null,"",window.location.pathname); return; }
          }
          const { data:{ session } } = await sb.auth.getSession();
          setSession(session); setAuthLoading(false);
        };
        handleRedirect();
        const { data:{ subscription } } = sb.auth.onAuthStateChange((_e,session)=>{ setSession(session); setAuthLoading(false); });
        return ()=>subscription.unsubscribe();
      },[]);

      useEffect(()=>{
        if (!session) return;
        setDataLoading(true);
        sb.from("tracker_data").select("*").eq("user_id",session.user.id).single()
          .then(({ data })=>{
            if (data?.payload) {
              const parsed = JSON.parse(data.payload);
              setAllData(parsed.data||{});
              setSettings(parsed.settings||DEFAULT_SETTINGS);
            } else {
              setSettings(DEFAULT_SETTINGS);
            }
            setDataLoading(false);
          }).catch(()=>{ setSettings(DEFAULT_SETTINGS); setDataLoading(false); });
      },[session]);

      // Set default singlesApp when settings load
      useEffect(()=>{ if(settings?.apps?.length) setSinglesApp(settings.apps[0].id); },[settings]);
      useEffect(()=>{ if(settings?.singlesBudget) setSinglesBudgetEdit(settings.singlesBudget); },[settings]);

      const persist = useCallback(async (newData, newSettings) => {
        if (!session) return;
        setSaving(true);
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async ()=>{
          await sb.from("tracker_data").upsert({ user_id:session.user.id, payload:JSON.stringify({ data:newData, settings:newSettings }) },{ onConflict:"user_id" });
          setSaving(false);
        }, 600);
      },[session]);

      const updatePeriod = (updater) => {
        const key = getPeriodKey(offset, settings?.resetDay||18);
        const newAll = {...allData};
        if (!newAll[key]) newAll[key]={};
        updater(newAll[key]);
        setAllData(newAll);
        persist(newAll, settings);
      };

      const handleSaveSettings = (newSettings) => {
        setSettings(newSettings);
        setShowSettings(false);
        persist(allData, newSettings);
      };

      const resetDay = settings?.resetDay||18;
      const getPeriodData = () => allData[getPeriodKey(offset,resetDay)]||{};
      const getPackData = appId => getPeriodData()[`pack_${appId}`]||[];
      const getSinglesData = () => getPeriodData().singles||[];
      const getSalesData = appId => getPeriodData()[`sales_${appId}`]||[];

      const handleAddPack = (appId, amt, note) => updatePeriod(p=>{
        const k=`pack_${appId}`; if(!p[k]) p[k]=[];
        p[k].unshift({ amount:amt, note, date:todayStr() });
      });
      const handleDeletePack = (appId,i) => updatePeriod(p=>{ const k=`pack_${appId}`; if(p[k]) p[k].splice(i,1); });
      const handleAddSale = async (appId, amt, note, location, imageUrl) => {
        // Save to personal tracker
        updatePeriod(p=>{
          const k=`sales_${appId}`; if(!p[k]) p[k]=[];
          p[k].unshift({ amount:amt, note, location, imageUrl, date:todayStr() });
        });
        // Also post to community feed
        const appLabel = settings?.apps?.find(a=>a.id===appId)?.label || appId;
        const username = settings?.displayName || session?.user?.email?.split("@")[0] || "collector";
        await sb.from("community_sales").insert({
          user_id: session.user.id,
          username,
          app_id: appId,
          app_label: appLabel,
          amount: amt,
          note,
          location: location||null,
          image_url: imageUrl||null,
          sold_at: new Date().toISOString()
        });
      };
      const handleDeleteSale = (appId,i) => updatePeriod(p=>{ const k=`sales_${appId}`; if(p[k]) p[k].splice(i,1); });
      const handleAddSingle = () => {
        const a=parseFloat(singlesAmt); if(!a||a<=0) return;
        updatePeriod(p=>{ if(!p.singles) p.singles=[]; p.singles.unshift({ amount:a, app:singlesApp, location:singlesLocation||undefined, note:singlesNote.trim()||"Single", date:todayStr() }); });
        setSinglesAmt(""); setSinglesNote("");
      };
      const handleDeleteSingle = i => updatePeriod(p=>{ if(p.singles) p.singles.splice(i,1); });

      if (authLoading) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><div className="spinner"/></div>;
      if (!session) return <AuthScreen />;

      // Access control - open to all when ALLOWED_EMAILS is empty
      if (ALLOWED_EMAILS.length > 0 && !ALLOWED_EMAILS.includes(session.user.email)) {
        return (
          <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"2rem",
            backgroundImage:"radial-gradient(ellipse at 20% 0%,rgba(230,36,41,0.07) 0%,transparent 50%)"}}>
            <div style={{maxWidth:400,width:"100%",textAlign:"center"}}>
              <div style={{fontSize:"3rem",marginBottom:"1rem"}}>🔒</div>
              <h2 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",letterSpacing:"0.08em",marginBottom:8}}>Private App</h2>
              <p style={{color:"#6b6b8a",fontSize:13,marginBottom:"1.5rem"}}>This app is currently private. You don't have access with this account.</p>
              <button onClick={()=>sb.auth.signOut()} style={{background:"none",border:"1px solid #1e1e2e",color:"#6b6b8a",borderRadius:8,padding:"8px 16px",cursor:"pointer",fontSize:13}}>Sign out</button>
            </div>
          </div>
        );
      }
      if (dataLoading||!settings) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><div className="spinner"/><p style={{color:"#6b6b8a",fontSize:13}}>Loading your collection…</p></div>;

      const apps = settings.apps||[];
      const singlesBudget = settings.singlesBudget||300;
      const singlesRollover = calcSinglesRollover(singlesBudget, offset, allData, resetDay);
      const singlesAvailable = singlesBudget + singlesRollover;
      const singlesData = getSinglesData();
      const singlesSpent = singlesData.reduce((s,t)=>s+t.amount,0);
      const singlesRemaining = singlesAvailable - singlesSpent;
      const singlesPct = (singlesSpent/singlesAvailable)*100;

      let totalPacksSpent=0, totalSold=0;
      const packRollovers={};
      apps.forEach(app=>{
        packRollovers[app.id] = calcPackRollover(app.id, app.packBudget||50, offset, allData, resetDay);
        totalPacksSpent += getPackData(app.id).reduce((s,t)=>s+t.amount,0);
        totalSold += getSalesData(app.id).reduce((s,t)=>s+t.amount,0);
      });

      const totalSpent = totalPacksSpent+singlesSpent;
      const totalInvested = totalSpent;
      const overallPnl = totalSold - totalInvested;
      const totalBudget = apps.reduce((s,a)=>s+(a.packBudget||50),0)+singlesAvailable;
      const totalRemaining = totalBudget-totalSpent;
      const totalPct = (totalSpent/totalBudget)*100;
      const remColor = totalRemaining<0?"#f87171":totalPct>85?"#fbbf24":"#4ade80";
      const pnlColor = overallPnl>0?"#4ade80":overallPnl<0?"#f87171":"#6b6b8a";

      return (
        <div style={{minHeight:"100vh",background:"#0a0a0f",color:"#e8e8f0",fontFamily:"'DM Sans',sans-serif",padding:"2rem 1rem",
          backgroundImage:"radial-gradient(ellipse at 20% 0%,rgba(230,36,41,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(129,140,248,0.07) 0%,transparent 50%)"}}>

          {showSettings && <SettingsScreen settings={settings} onSave={handleSaveSettings} onClose={()=>setShowSettings(false)} />}

          {/* Header */}
          <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
            <h1 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"clamp(2.5rem,8vw,4rem)",letterSpacing:"0.05em",lineHeight:1,
              background:"linear-gradient(135deg,#fff 0%,#6b6b8a 100%)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text"}}>Hobby Tracker</h1>
            <p style={{color:"#6b6b8a",fontSize:11,letterSpacing:"0.15em",textTransform:"uppercase",marginTop:4}}>
              ${apps.reduce((s,a)=>s+(a.packBudget||50),0)} packs · ${singlesBudget} singles · Resets {resetDay}th
            </p>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
              {saving && <span style={{color:"#6b6b8a",fontSize:11}}>Saving…</span>}
              <div style={{display:"flex",background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,padding:3,gap:3}}>
                <button onClick={()=>setPage("tracker")} style={{background:page==="tracker"?"rgba(255,255,255,0.08)":"none",border:"none",color:page==="tracker"?"#e8e8f0":"#6b6b8a",borderRadius:6,padding:"4px 12px",cursor:"pointer",fontSize:12,fontWeight:page==="tracker"?600:400}}>📊 My Tracker</button>
                <button onClick={()=>setPage("feed")} style={{background:page==="feed"?"rgba(255,255,255,0.08)":"none",border:"none",color:page==="feed"?"#e8e8f0":"#6b6b8a",borderRadius:6,padding:"4px 12px",cursor:"pointer",fontSize:12,fontWeight:page==="feed"?600:400}}>🌐 Sales Feed</button>
                <button onClick={()=>setPage("wishlist")} style={{background:page==="wishlist"?"rgba(255,255,255,0.08)":"none",border:"none",color:page==="wishlist"?"#e8e8f0":"#6b6b8a",borderRadius:6,padding:"4px 12px",cursor:"pointer",fontSize:12,fontWeight:page==="wishlist"?600:400}}>🔍 Wishlist</button>
              </div>
              <button onClick={()=>setShowSettings(true)} style={{background:"none",border:"1px solid #1e1e2e",color:"#818cf8",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer"}}>⚙️ Settings</button>
              <a href="https://ko-fi.com/machjb1" target="_blank" rel="noopener noreferrer"
                style={{background:"rgba(255,94,94,0.1)",border:"1px solid rgba(255,94,94,0.3)",color:"#ff6b6b",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer",textDecoration:"none",display:"inline-flex",alignItems:"center",gap:4}}>
                ☕ Donate
              </a>
              <button onClick={()=>sb.auth.signOut()} style={{background:"none",border:"1px solid #1e1e2e",color:"#6b6b8a",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer"}}>Sign out</button>
            </div>
          </div>

          {page==="feed" && <CommunityFeed session={session} />}
          {page==="wishlist" && <WishlistFeed session={session} settings={settings} />}
          {page==="tracker" && <>

          {/* Period nav */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16,marginBottom:"2rem"}}>
            <button onClick={()=>setOffset(o=>o-1)} style={{background:"#12121a",border:"1px solid #1e1e2e",color:"#e8e8f0",width:36,height:36,borderRadius:"50%",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.35rem",letterSpacing:"0.1em"}}>{periodLabel(offset,resetDay)}</div>
              {offset!==0 && <button onClick={()=>setOffset(0)} style={{background:"none",border:"none",color:"#818cf8",fontSize:11,cursor:"pointer",textDecoration:"underline",marginTop:2}}>Back to current</button>}
            </div>
            <button onClick={()=>setOffset(o=>o+1)} style={{background:"#12121a",border:"1px solid #1e1e2e",color:"#e8e8f0",width:36,height:36,borderRadius:"50%",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
          </div>

          {/* Singles Pool */}
          <div style={{maxWidth:1100,margin:"0 auto 0.75rem",fontSize:11,color:"#6b6b8a",letterSpacing:"0.15em",textTransform:"uppercase",display:"flex",alignItems:"center",gap:10}}>
            Singles Budget — Shared Pool <div style={{flex:1,height:1,background:"#1e1e2e"}} />
          </div>
          <div style={{maxWidth:1100,margin:"0 auto 1.5rem",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:16,padding:"1.25rem",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,#818cf8,#c084fc)"}} />
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:10}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:34,height:34,borderRadius:8,background:"linear-gradient(135deg,#818cf8,#c084fc)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontFamily:"'Bebas Neue',sans-serif",fontSize:12}}>1s</div>
                <div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.15rem",letterSpacing:"0.08em"}}>Singles Pool</div>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginTop:2}}>
                    <span style={{fontSize:11,color:"#6b6b8a"}}>Budget:</span>
                    <span style={{fontSize:11,color:"#6b6b8a"}}>$</span>
                    <input type="number" min="0" value={singlesBudgetEdit}
                      onChange={e=>setSinglesBudgetEdit(e.target.value)}
                      onBlur={()=>{ const v=parseFloat(singlesBudgetEdit); if(v>0&&v!==singlesBudget){ const ns={...settings,singlesBudget:v}; setSettings(ns); persist(allData,ns); }}}
                      onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }}
                      style={{width:70,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:6,color:"#818cf8",padding:"2px 6px",fontFamily:"inherit",fontSize:12,fontWeight:600}} />
                    <span style={{fontSize:11,color:"#6b6b8a"}}>/month</span>
                  </div>
                </div>
              </div>
              <div style={{display:"flex",gap:20}}>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.35rem",lineHeight:1,color:singlesPct<60?"#4ade80":singlesPct<85?"#fbbf24":"#f87171"}}>
                    {fmtMoney(singlesRemaining)}{singlesRollover>0?` ▴$${singlesRollover.toFixed(0)}`:""}
                  </div>
                  <div style={{fontSize:10,color:"#6b6b8a",textTransform:"uppercase",letterSpacing:"0.1em"}}>Remaining</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.35rem",lineHeight:1,color:"#818cf8"}}>{fmtMoney(singlesSpent)}</div>
                  <div style={{fontSize:10,color:"#6b6b8a",textTransform:"uppercase",letterSpacing:"0.1em"}}>Spent</div>
                </div>
              </div>
            </div>
            <ProgressBar pct={singlesPct} color="linear-gradient(90deg,#818cf8,#c084fc)" over={singlesSpent>singlesAvailable} />
            <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
              <input value={singlesAmt} onChange={e=>setSinglesAmt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleAddSingle()} type="number" min="0" step="0.01" placeholder="$0.00"
                style={{flex:"1 1 70px",minWidth:70,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13}} />
              <select value={singlesApp} onChange={e=>setSinglesApp(e.target.value)}
                style={{flex:"1 1 100px",minWidth:100,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13,cursor:"pointer"}}>
                {apps.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}
              </select>
              <select value={singlesLocation} onChange={e=>setSinglesLocation(e.target.value)}
                style={{flex:"1 1 90px",minWidth:90,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13,cursor:"pointer"}}>
                <option value="">Location</option>
                {(settings.locations||[]).map(loc=><option key={loc} value={loc}>{loc}</option>)}
              </select>
              <input value={singlesNote} onChange={e=>setSinglesNote(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleAddSingle()} type="text" placeholder="Card name / note"
                style={{flex:"2 1 120px",minWidth:120,background:"#0a0a0f",border:"1px solid #1e1e2e",borderRadius:8,color:"#e8e8f0",padding:"6px 10px",fontFamily:"inherit",fontSize:13}} />
              <button onClick={handleAddSingle} style={{background:"rgba(129,140,248,0.1)",border:"1px solid rgba(129,140,248,0.3)",color:"#818cf8",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>+ Add Single</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:150,overflowY:"auto"}}>
              {singlesData.length===0
                ? <div style={{textAlign:"center",color:"#6b6b8a",fontSize:12,padding:8}}>No singles logged yet</div>
                : singlesData.map((t,i)=><TxRow key={i} tx={t} onDelete={()=>handleDeleteSingle(i)} showApp apps={apps} />)}
            </div>
          </div>

          {/* Pack Cards */}
          <div style={{maxWidth:1100,margin:"0 auto 0.75rem",fontSize:11,color:"#6b6b8a",letterSpacing:"0.15em",textTransform:"uppercase",display:"flex",alignItems:"center",gap:10}}>
            Per App — Packs · Sales · P&L <div style={{flex:1,height:1,background:"#1e1e2e"}} />
          </div>
          <div style={{maxWidth:1100,margin:"0 auto 2rem",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:"1.25rem"}}>
            {apps.map(app=><AppCard key={app.id} app={app} packData={getPackData(app.id)} salesData={getSalesData(app.id)} singlesForApp={getSinglesData().filter(t=>t.app===app.id)} onAddPack={handleAddPack} onDeletePack={handleDeletePack} onAddSale={handleAddSale} onDeleteSale={handleDeleteSale} rollover={packRollovers[app.id]} apps={apps} locations={settings.locations||[]} />)}
          </div>

          {/* Summary */}
          <div style={{maxWidth:1100,margin:"0 auto",background:"#12121a",border:"1px solid #1e1e2e",borderRadius:16,padding:"1.25rem 1.5rem",display:"flex",alignItems:"center",justifyContent:"space-around",flexWrap:"wrap",gap:16}}>
            {[
              {val:fmtMoney(totalInvested), lbl:"Total Invested"},
              {val:fmtMoney(totalSold),     lbl:"Total Sold",      color:"#4ade80"},
              {val:(overallPnl>=0?"+":"")+fmtMoney(overallPnl), lbl:"Overall P&L", color:pnlColor},
              {val:fmtMoney(totalRemaining),lbl:"Budget Left",     color:remColor},
            ].map(({val,lbl,color})=>(
              <div key={lbl} style={{textAlign:"center"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.8rem",lineHeight:1,color:color||"#e8e8f0"}}>{val}</div>
                <div style={{fontSize:10,color:"#6b6b8a",textTransform:"uppercase",letterSpacing:"0.12em",marginTop:2}}>{lbl}</div>
              </div>
            ))}
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:"1.8rem",lineHeight:1}}>{guiltEmoji(totalPct)}</div>
              <div style={{fontSize:10,color:"#6b6b8a",textTransform:"uppercase",letterSpacing:"0.12em",marginTop:2}}>Guilt Meter</div>
            </div>
          </div>
          <p style={{textAlign:"center",color:"#2a2a3e",fontSize:10,marginTop:"1.5rem"}}>Signed in as {session.user.email}</p>
          <div style={{textAlign:"center",marginTop:"1rem",paddingBottom:"1rem"}}>
            <a href="https://ko-fi.com/machjb1" target="_blank" rel="noopener noreferrer"
              style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(255,94,94,0.08)",border:"1px solid rgba(255,94,94,0.2)",borderRadius:12,padding:"10px 20px",textDecoration:"none",color:"#ff6b6b",fontSize:13,fontWeight:500}}>
              ☕ Enjoying Hobby Tracker? Consider donating!
            </a>
          </div>
        </>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
